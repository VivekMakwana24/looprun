openapi: 3.0.3
info:
  title: Looprun API
  version: 1.0.0
  description: >
    The phone records and displays; the server decides loops, cells, ownership and cheating.
    All paths are under /v1. All times are epoch milliseconds (UTC). Coordinates are WGS84 degrees.
servers:
  - url: /v1
security:
  - bearer: []
paths:
  /auth/google:
    post:
      security: []
      summary: Exchange a Google ID token for a Looprun session token
      description: >
        When env LOOPRUN_DEV_AUTH=1, an id_token of the form "dev:<name>" is accepted and creates/returns
        the user "<name>" (for tests and local development only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string}
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {description: Invalid token}
  /runs:
    post:
      summary: Upload a finished run (idempotent on id)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunUpload"}
      responses:
        "202":
          description: Accepted for processing (a repeat upload of the same id returns the same body)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "413": {description: Too many fixes or payload too large}
        "422": {description: Validation error}
        "429": {description: Rate limited}
  /runs/{id}:
    get:
      summary: Status and result of a run
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "404": {description: Unknown run or not yours}
  /cells:
    get:
      summary: Claimed cells inside a bounding box
      parameters:
        - name: bbox
          in: query
          required: true
          description: "minLng,minLat,maxLng,maxLat. Server rejects boxes larger than 0.2 degrees on a side with 422."
          schema: {type: string}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  cells:
                    type: array
                    items: {$ref: "#/components/schemas/Cell"}
  /leaderboard/weekly:
    get:
      summary: Cells held, ranked, for the current ISO week
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  week: {type: string, example: "2026-W45"}
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: {type: integer}
                        user: {$ref: "#/components/schemas/UserRef"}
                        cells: {type: integer}
  /me/home-zones:
    put:
      summary: Replace the user's hidden zones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zones:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [lat, lng, radius_m]
                    properties:
                      lat: {type: number}
                      lng: {type: number}
                      radius_m: {type: number, minimum: 50, maximum: 1000}
      responses:
        "204": {description: Saved}
  /me/freeze:
    post:
      summary: Start (days>0) or end (days=0) a decay freeze; at most 30 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: {type: integer, minimum: 0, maximum: 30}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  freeze_until: {type: integer, nullable: true}
  /me:
    delete:
      summary: Delete the account, its runs and its cell power
      responses:
        "204": {description: Deleted}
  /reports:
    post:
      summary: Report a run or a cell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target_id, reason]
              properties:
                kind: {type: string, enum: [run, cell]}
                target_id: {type: string}
                reason: {type: string, maxLength: 500}
      responses:
        "202": {description: Recorded}
  /live:
    get:
      summary: WebSocket (upgrade) that pushes cell ownership changes in a bbox
      description: >
        Connect to /v1/live?bbox=minLng,minLat,maxLng,maxLat&token=<access_token>.
        Server sends JSON text frames {"type":"cell_changed","cell":"<h3>","owner":UserRef|null,"mine":bool}.
        Hidden cells are never sent with an owner.
      responses:
        "101": {description: Switching protocols}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    UserRef:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
    Session:
      type: object
      properties:
        access_token: {type: string}
        user: {$ref: "#/components/schemas/UserRef"}
    Fix:
      type: object
      required: [lat, lng, t, acc]
      properties:
        lat: {type: number}
        lng: {type: number}
        t: {type: integer, description: epoch ms}
        acc: {type: number, description: horizontal accuracy in metres}
        mock: {type: boolean, default: false, description: Android isMock flag}
    RunUpload:
      type: object
      required: [id, started_at, ended_at, fixes]
      properties:
        id: {type: string, format: uuid, description: client generated}
        started_at: {type: integer}
        ended_at: {type: integer}
        integrity_token: {type: string, nullable: true}
        fixes:
          type: array
          maxItems: 20000
          items: {$ref: "#/components/schemas/Fix"}
    Flag:
      type: object
      properties:
        code: {type: string, example: mock_location}
        severity: {type: string, enum: [hard, soft]}
        detail: {type: string}
    RunStatus:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [processing, accepted, pending_review, rejected]}
        distance_m: {type: number, nullable: true}
        moving_seconds: {type: integer, nullable: true}
        loops:
          type: array
          items:
            type: object
            properties:
              cells: {type: integer}
              area_km2: {type: number}
        cells_claimed: {type: integer}
        cells_taken_from_others: {type: integer}
        flags:
          type: array
          items: {$ref: "#/components/schemas/Flag"}
    Cell:
      type: object
      properties:
        id: {type: string, description: H3 index at resolution 10}
        owner: {allOf: [{$ref: "#/components/schemas/UserRef"}], nullable: true}
        mine: {type: boolean}
        hidden: {type: boolean, description: "true when privacy rules hide the owner's name; owner is then null"}
