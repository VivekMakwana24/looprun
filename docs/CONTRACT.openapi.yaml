openapi: 3.0.3
info:
  title: Looprun API
  version: 1.0.0
  description: >
    The phone records and displays; the server decides loops, cells, ownership and cheating.
    All paths are under /v1. All times are epoch milliseconds (UTC). Coordinates are WGS84 degrees.
servers:
  - url: /v1
security:
  - bearer: []
paths:
  /auth/google:
    post:
      security: []
      summary: Exchange a Google ID token for a Looprun session token
      description: >
        When env LOOPRUN_DEV_AUTH=1, an id_token of the form "dev:<name>" is accepted and creates/returns
        the user "<name>" (for tests and local development only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string}
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {description: Invalid Google ID token (or dev token while dev auth is off)}
        "422": {description: Validation error}
        "503": {description: Google sign-in is not configured on the server}
  /runs:
    post:
      summary: Upload a finished run (idempotent on id)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunUpload"}
      responses:
        "202":
          description: Accepted for processing (a repeat upload of the same id returns the same body)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "401": {description: Missing, invalid or expired token (or the user no longer exists)}
        "403": {description: The account is being deleted; uploads are refused}
        "409": {description: The run id already belongs to another user}
        "413": {description: Too many fixes (more than 20000) or request body too large (also when sent chunked)}
        "422": {description: "Validation error: also NaN/Infinity and numbers outside the allowed range (times must be before year 2100)"}
        "429": {description: Rate limited; the Retry-After header says how many seconds to wait}
        "503": {description: Queue unavailable; nothing was stored, retry with the same id}
  /runs/{id}:
    get:
      summary: Status and result of a run
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "404": {description: Unknown run or not yours}
        "422": {description: The id is not a UUID}
  /cells:
    get:
      summary: Claimed cells inside a bounding box
      parameters:
        - name: bbox
          in: query
          required: true
          description: "minLng,minLat,maxLng,maxLat. Server rejects boxes larger than 0.2 degrees on a side with 422."
          schema: {type: string}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  cells:
                    type: array
                    items: {$ref: "#/components/schemas/Cell"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: Malformed bbox, or larger than 0.2 degrees on a side}
        "429": {description: "Rate limited: 120 requests per minute per user by default (LOOPRUN_CELLS_RATE_LIMIT); see Retry-After"}
  /leaderboard/weekly:
    get:
      summary: Cells held, ranked, for the current ISO week
      description: >
        Counts only what GET /cells shows other people with a name: ownership that is already published (same
        delay), whose owner is not in a home zone and not hidden by the K-anonymity rule, and whose account is
        not being deleted. Users whose cells are all hidden are not listed. The caller additionally sees their own
        entry at once.
      responses:
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  week: {type: string, example: "2026-W45"}
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: {type: integer}
                        user: {$ref: "#/components/schemas/UserRef"}
                        cells: {type: integer}
  /me/home-zones:
    put:
      summary: Replace the user's hidden zones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zones:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [lat, lng, radius_m]
                    properties:
                      lat: {type: number}
                      lng: {type: number}
                      radius_m: {type: number, minimum: 50, maximum: 1000}
      responses:
        "204": {description: Saved}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: More than 5 zones, radius outside 50..1000 m, or coordinates out of range}
  /me/freeze:
    post:
      summary: Start (days>0) or end (days=0) a decay freeze; at most 30 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: {type: integer, minimum: 0, maximum: 30}
      description: >
        At most 30 frozen days in any rolling 90 days. Starting a freeze fixes the decay that has already happened
        (a freeze cannot bring faded power back). Ending a freeze (days=0) forgives the paused time.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  freeze_until: {type: integer, nullable: true}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "409": {description: The 30-days-in-90 quota would be exceeded; nothing was changed}
        "422": {description: days outside 0..30}
  /me:
    delete:
      summary: Delete the account, its runs and its cell power
      description: >
        Resumable. The account is first marked "deleting" (new uploads get 403), cells it held pass to the
        strongest remaining player or become free, then everything is deleted and the user last. If the server is
        busy (or a lock, MongoDB or Redis fails half way) it answers 503 with Retry-After and the call can simply be
        repeated with the same token. While the account is "deleting" it is already hidden from the map, the
        leaderboard and live frames.
      responses:
        "204": {description: Deleted}
        "401": {description: Missing, invalid or expired token, or the account is already deleted}
        "503": {description: Busy; repeat the request (see Retry-After)}
  /reports:
    post:
      summary: Report a run or a cell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target_id, reason]
              properties:
                kind: {type: string, enum: [run, cell]}
                target_id: {type: string}
                reason: {type: string, maxLength: 500}
      responses:
        "202": {description: Recorded}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: Validation error}
        "429": {description: Rate limited (20 per hour)}
  /live:
    get:
      summary: WebSocket (upgrade) that pushes cell ownership changes in a bbox
      description: >
        Connect to /v1/live?bbox=minLng,minLat,maxLng,maxLat and, as the FIRST message, send
        {"type":"auth","token":"<access_token>"} within 10 seconds. Clients should prefer this form: a token in the
        URL (the older `&token=<access_token>` query parameter, still accepted) ends up in proxy and access logs.
        Failures in the HTTP handshake (before the upgrade) are plain HTTP 403: a bad or too large bbox, an invalid,
        expired or unknown `token` query parameter, a user that is being deleted, or more than 5 concurrent sockets
        for the user. After the upgrade, a first message that is missing, not JSON, not an auth message, has an
        invalid or expired token, or names a user that no longer exists closes the socket with code 4401 (no
        first message within 10 s: also 4401); a sixth concurrent socket is closed with code 4429. At most 5 sockets
        per user may be open at once. Sockets of a user that is deleted are closed with 4401.
        Server sends JSON text frames {"type":"cell_changed","cell":"<h3>","lat":number,"lng":number,"owner":UserRef|null,"mine":bool}
        (lat,lng = cell centre). Other people's changes arrive after the publish delay. Hidden cells are never sent
        with an owner.
      responses:
        "101": {description: Switching protocols}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    UserRef:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
    Session:
      type: object
      properties:
        access_token: {type: string}
        user: {$ref: "#/components/schemas/UserRef"}
    Fix:
      type: object
      required: [lat, lng, t, acc]
      properties:
        lat: {type: number}
        lng: {type: number}
        t: {type: integer, description: epoch ms}
        acc: {type: number, description: horizontal accuracy in metres}
        mock: {type: boolean, default: false, description: Android isMock flag}
    RunUpload:
      type: object
      required: [id, started_at, ended_at, fixes]
      properties:
        id: {type: string, format: uuid, description: client generated}
        started_at: {type: integer}
        ended_at: {type: integer}
        integrity_token: {type: string, nullable: true}
        fixes:
          type: array
          maxItems: 20000
          items: {$ref: "#/components/schemas/Fix"}
    Flag:
      type: object
      properties:
        code: {type: string, example: mock_location}
        severity: {type: string, enum: [hard, soft]}
        detail: {type: string}
    RunStatus:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [processing, accepted, pending_review, rejected]}
        distance_m: {type: number, nullable: true}
        moving_seconds: {type: integer, nullable: true}
        loops:
          type: array
          items:
            type: object
            properties:
              cells: {type: integer}
              area_km2: {type: number}
        cells_claimed: {type: integer}
        cells_taken_from_others: {type: integer}
        flags:
          type: array
          items: {$ref: "#/components/schemas/Flag"}
    Cell:
      type: object
      properties:
        id: {type: string, description: H3 index at resolution 10}
        lat: {type: number, description: "Cell centre latitude (server computes it with the engine so the app needs no H3 library)"}
        lng: {type: number, description: "Cell centre longitude"}
        owner: {allOf: [{$ref: "#/components/schemas/UserRef"}], nullable: true}
        mine: {type: boolean}
        hidden: {type: boolean, description: "true when privacy rules hide the owner's name; owner is then null"}
