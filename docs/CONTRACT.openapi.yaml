openapi: 3.0.3
info:
  title: Looprun API
  version: 1.0.0
  description: >
    The phone records and displays; the server decides loops, cells, ownership and cheating.
    All paths are under /v1. All times are epoch milliseconds (UTC). Coordinates are WGS84 degrees.
servers:
  - url: /v1
security:
  - bearer: []
paths:
  /auth/google:
    post:
      security: []
      summary: Exchange a Google ID token for a Looprun session token
      description: >
        When env LOOPRUN_DEV_AUTH=1, an id_token of the form "dev:<name>" is accepted and creates/returns
        the user "<name>" (for tests and local development only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string}
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {description: Invalid Google ID token (or dev token while dev auth is off)}
        "422": {description: Validation error}
        "503": {description: Google sign-in is not configured on the server}
  /runs:
    post:
      summary: Upload a finished run (idempotent on id)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunUpload"}
      responses:
        "202":
          description: Accepted for processing (a repeat upload of the same id returns the same body)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "401": {description: Missing, invalid or expired token (or the user no longer exists)}
        "403": {description: The account is being deleted; uploads are refused}
        "409": {description: The run id already belongs to another user}
        "413": {description: Too many fixes (more than 20000) or request body too large (also when sent chunked)}
        "422": {description: "Validation error: also NaN/Infinity and numbers outside the allowed range (times must be before year 2100)"}
        "429": {description: Rate limited; the Retry-After header says how many seconds to wait}
        "503": {description: Queue unavailable; nothing was stored, retry with the same id}
    get:
      summary: The caller's own run history, newest first (Phase 1a)
      description: Same card shape as the feed plus status; includes runs that are processing, pending_review or rejected. Full, unfiltered numbers (own runs). Opponent names follow the publish delay and privacy rules.
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: status, in: query, required: false, schema: {type: string, enum: [processing, accepted, pending_review, rejected]}}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/RunCard"}}
                  next_cursor: {type: string, nullable: true}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: Bad limit, cursor or status}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /runs/{id}:
    get:
      summary: Status and result of a run
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunStatus"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "404": {description: Unknown run or not yours}
        "422": {description: The id is not a UUID}
  /cells:
    get:
      summary: Claimed cells inside a bounding box
      parameters:
        - name: bbox
          in: query
          required: true
          description: "minLng,minLat,maxLng,maxLat. Server rejects boxes larger than 0.2 degrees on a side with 422."
          schema: {type: string}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  cells:
                    type: array
                    items: {$ref: "#/components/schemas/Cell"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: Malformed bbox, or larger than 0.2 degrees on a side}
        "429": {description: "Rate limited: 120 requests per minute per user by default (LOOPRUN_CELLS_RATE_LIMIT); see Retry-After"}
  /leaderboard/weekly:
    get:
      summary: Cells held, ranked, for the current ISO week
      description: >
        Counts only what GET /cells shows other people with a name: ownership that is already published (same
        delay), whose owner is not in a home zone and not hidden by the K-anonymity rule, and whose account is
        not being deleted. Users whose cells are all hidden are not listed. The caller additionally sees their own
        entry at once.
      responses:
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  week: {type: string, example: "2026-W45"}
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: {type: integer}
                        user: {$ref: "#/components/schemas/UserRef"}
                        cells: {type: integer}
                  me:
                    type: object
                    description: >
                      The caller's own place (D10), also when it is below the listed entries. rank is null and
                      cells is 0 when the caller holds no cells.
                    properties:
                      rank: {type: integer, nullable: true}
                      cells: {type: integer}
  /me/home-zones:
    put:
      summary: Replace the user's hidden zones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                zones:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [lat, lng, radius_m]
                    properties:
                      lat: {type: number}
                      lng: {type: number}
                      radius_m: {type: number, minimum: 50, maximum: 1000}
      responses:
        "204": {description: Saved}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: More than 5 zones, radius outside 50..1000 m, or coordinates out of range}
  /me/freeze:
    post:
      summary: Start (days>0) or end (days=0) a decay freeze; at most 30 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: {type: integer, minimum: 0, maximum: 30}
      description: >
        At most 30 frozen days in any rolling 90 days. Starting a freeze fixes the decay that has already happened
        (a freeze cannot bring faded power back). Ending a freeze (days=0) forgives the paused time.
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FreezeStatus"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "409": {description: The 30-days-in-90 quota would be exceeded; nothing was changed}
        "422": {description: days outside 0..30}
  /me:
    get:
      summary: The caller's own settings (name, home zones, freeze state and quota used)
      description: Read-only (D10). It never settles an expired freeze; it only reports.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: "#/components/schemas/UserRef"}
                  home_zones:
                    type: array
                    items:
                      type: object
                      properties:
                        lat: {type: number}
                        lng: {type: number}
                        radius_m: {type: number}
                  freeze: {$ref: "#/components/schemas/FreezeStatus"}
                  name_hidden: {type: boolean, description: "true when moderation hid the caller's display name from others (Phase 1a)"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
    delete:
      summary: Delete the account, its runs and its cell power
      description: >
        Resumable. The account is first marked "deleting" (new uploads get 403), cells it held pass to the
        strongest remaining player or become free, then everything is deleted and the user last. If the server is
        busy (or a lock, MongoDB or Redis fails half way) it answers 503 with Retry-After and the call can simply be
        repeated with the same token. Phase 1a: it also removes follows, kudos, comments, notifications, blocks and
        battle events naming the user (docs/PHASE1_SPEC.md section 9). While the account is "deleting" it is already hidden from the map, the
        leaderboard and live frames.
      responses:
        "204": {description: Deleted}
        "401": {description: Missing, invalid or expired token, or the account is already deleted}
        "503": {description: Busy; repeat the request (see Retry-After)}
    patch:
      summary: Rename the caller (display name)
      description: >
        Length 2..30 after trimming and collapsing inner whitespace; no control characters; must pass the profanity
        hook. A moderator hide of the name stays after a rename. Allowed 5 times per 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: {type: string, minLength: 2, maxLength: 30}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: "#/components/schemas/UserRef"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: "Length, characters, or profanity (code name_rejected)"}
        "429": {description: Rate limited}
  /reports:
    post:
      summary: Report a run, a cell, a user, a comment or a run card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target_id, reason]
              properties:
                kind: {type: string, enum: [run, cell, user, comment, run_card], description: "user: target_id is a user id; comment: a comment id; run_card: a run id seen in the feed (the target must be visible to the reporter, else 404). run and cell keep their old behaviour. A repeat report of the same target by the same user is a no-op 202."}
                target_id: {type: string}
                reason: {type: string, maxLength: 500}
      responses:
        "202": {description: Recorded}
        "404": {description: "kind user, comment or run_card: the target is not visible to the reporter"}
        "401": {description: Missing, invalid or expired token}
        "403": {description: The account is being deleted; every route except DELETE /me refuses it}
        "422": {description: Validation error}
        "429": {description: Rate limited (20 per hour)}
  /live:
    get:
      summary: WebSocket (upgrade) that pushes cell ownership changes in a bbox
      description: >
        Connect to /v1/live?bbox=minLng,minLat,maxLng,maxLat and, as the FIRST message, send
        {"type":"auth","token":"<access_token>"} within 10 seconds. Clients should prefer this form: a token in the
        URL (the older `&token=<access_token>` query parameter, still accepted) ends up in proxy and access logs.
        Failures in the HTTP handshake (before the upgrade) are plain HTTP 403: a bad or too large bbox, an invalid,
        expired or unknown `token` query parameter, a user that is being deleted, or more than 5 concurrent sockets
        for the user. After the upgrade, a first message that is missing, not JSON, not an auth message, has an
        invalid or expired token, or names a user that no longer exists closes the socket with code 4401 (no
        first message within 10 s: also 4401); a sixth concurrent socket is closed with code 4429. At most 5 sockets
        per user may be open at once. Sockets of a user that is deleted are closed with 4401.
        Server sends JSON text frames {"type":"cell_changed","cell":"<h3>","lat":number,"lng":number,
        "boundary":[[lat,lng] x 6],"owner":UserRef|null,"mine":bool} (lat,lng = cell centre; boundary = the
        hexagon corners, D10). A frame about the receiver's own cell (mine = true) also carries "strength" (0..1,
        see Cell). Other people's changes arrive after the publish delay. Hidden cells are never sent with an owner.
      responses:
        "101": {description: Switching protocols}
  # ------------------------------------------------------------------ Phase 1a (social + battles), see docs/PHASE1_SPEC.md
  # Error body for every phase-1a route: {"detail": {"code": "<slug>", "message": "<text>"}}. 401 and 403 (account
  # being deleted) apply to all of them and are listed once in the spec. Lists use ?limit (1..50, default 20) and an
  # opaque ?cursor; the response carries next_cursor (null at the end).
  /users/search:
    get:
      summary: Find users by display-name prefix
      description: Case-insensitive prefix, 2..30 characters. At most 20 results, no paging. Excludes the caller, users being deleted, users whose name moderation hid, and blocked pairs.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 30}}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/UserListItem"}
        "422": {description: q shorter than 2 or longer than 30}
        "429": {description: "Rate limited: 30 per minute"}
  /users/{id}:
    get:
      summary: Public profile
      description: 404 when the user is unknown, being deleted, or blocked in either direction (the caller cannot tell which).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "404": {description: Unknown user, being deleted, or blocked either way}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /users/{id}/follow:
    put:
      summary: Follow a user (idempotent)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FollowState"}
        "404": {description: Unknown user, being deleted, or blocked either way}
        "409": {description: "Following limit reached (500), code follow_limit"}
        "422": {description: Cannot follow yourself, code self}
        "429": {description: "Rate limited: 100 follow or unfollow calls per hour"}
    delete:
      summary: Unfollow (idempotent)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FollowState"}
        "429": {description: "Rate limited: shared with follow"}
  /me/followers:
    get:
      summary: People who follow the caller, newest first
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/UserListItem"}}
                  next_cursor: {type: string, nullable: true}
        "422": {description: Bad limit or cursor}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /me/following:
    get:
      summary: People the caller follows, newest first
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/UserListItem"}}
                  next_cursor: {type: string, nullable: true}
        "422": {description: Bad limit or cursor}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /me/rivals:
    get:
      summary: Users the caller traded cells with in the last 30 days (either direction)
      description: Only opponents whose name is visible for the cells involved (privacy rules of GET /cells); each is listed once, most recent battle first. At most 50.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/UserListItem"}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /feed:
    get:
      summary: Accepted runs of people the caller follows, plus the caller's own, newest first
      description: >
        Others' runs appear only after the publish delay (own runs at once). Never contains GPS points, start or end
        points. Runs of the last 90 days only. Cards never include runs of blocked users or runs hidden by moderation.
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/RunCard"}}
                  next_cursor: {type: string, nullable: true}
        "422": {description: Bad limit or cursor}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /runs/{id}/kudos:
    put:
      summary: Give kudos (idempotent; one per user per run)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KudosState"}
        "404": {description: Run not visible to the caller (not a followed user's published, accepted run, or blocked, or hidden)}
        "422": {description: Own run, code own_run}
        "429": {description: "Rate limited: 120 per hour (kudos give and remove together)"}
    delete:
      summary: Remove own kudos (idempotent)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KudosState"}
        "404": {description: Run not visible to the caller}
        "429": {description: Rate limited, shared with give}
  /runs/{id}/comments:
    get:
      summary: Comments on a run the caller may see, oldest first
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Comment"}}
                  next_cursor: {type: string, nullable: true}
        "404": {description: Run not visible to the caller}
        "422": {description: Bad limit or cursor}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
    post:
      summary: Add a comment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 500, description: "Trimmed; empty after trimming is 422"}
      responses:
        "201":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Comment"}
        "404": {description: Run not visible to the caller}
        "409": {description: "At most 200 comments per run, code comment_limit"}
        "422": {description: Empty or longer than 500 characters}
        "429": {description: "Rate limited: 30 per hour, 5 per minute"}
  /runs/{id}/comments/{comment_id}:
    delete:
      summary: Delete a comment (the author, or the owner of the run)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: comment_id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Deleted (also when it was already gone)}
        "403": {description: The caller is neither the author nor the run owner}
        "404": {description: Run not visible to the caller}
  /battles/summary:
    get:
      summary: Cells taken and lost by the caller in the last 7 days
      description: Counts include events whose opponent name is hidden. Events count only after the publish delay.
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BattleSummary"}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /battles/rivalry:
    get:
      summary: Per-opponent battle totals
      description: Only opponents whose name is visible for the cells involved; hidden battles appear in `unattributed`. Sorted by taken+lost descending, then last_battle_at. At most 50.
      parameters:
        - {name: days, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: {type: integer}
                  rivals:
                    type: array
                    items: {$ref: "#/components/schemas/Rival"}
                  unattributed: {$ref: "#/components/schemas/BattleCounts"}
        "422": {description: days outside 1..90}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /battles/take-back:
    get:
      summary: Cells the caller lost in the last 7 days, to draw and win back
      description: >
        Cells that currently belong to somebody else (or nobody) and that the caller lost in the last 7 days, newest
        first, at most 500. `lost_to` is null when the taker's name is hidden (home zone, K-anonymity) or the taker
        was deleted. A cell the caller has since won back is not listed.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  cells:
                    type: array
                    items: {$ref: "#/components/schemas/LostCell"}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /notifications:
    get:
      summary: In-app notifications inbox, newest first
      description: Only notifications whose visible_at has passed (the publish delay for other people's actions). Items are kept 60 days.
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Notification"}}
                  next_cursor: {type: string, nullable: true}
                  unread_count: {type: integer}
        "422": {description: Bad limit or cursor}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /notifications/unread-count:
    get:
      summary: Number of unread, visible notifications
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count: {type: integer}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
  /notifications/read:
    post:
      summary: Mark notifications read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, maxItems: 100, items: {type: string}, description: "Mark these read; ids that are not the caller's are ignored"}
                all: {type: boolean, default: false, description: "Mark every visible notification read; ids must then be empty"}
      responses:
        "204": {description: Done}
        "422": {description: Neither ids nor all, or both}
  /users/{id}/block:
    put:
      summary: Block a user (idempotent)
      description: Removes follows in both directions, kudos between the two and the notifications between the two. Afterwards neither sees the other in feed, comments, search, rivals, battles lists or profile.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Blocked}
        "404": {description: Unknown user or being deleted}
        "409": {description: "At most 500 blocks, code block_limit"}
        "422": {description: Cannot block yourself, code self}
        "429": {description: "Rate limited: 30 per hour"}
    delete:
      summary: Unblock (idempotent; follows are not restored)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Done}
  /me/blocks:
    get:
      summary: Users the caller has blocked
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/UserRef"}}
                  next_cursor: {type: string, nullable: true}
        "429": {description: "Rate limited: 120 read requests per minute across all phase 1a read routes (Retry-After says how long to wait)"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    UserRef:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
    Session:
      type: object
      properties:
        access_token: {type: string}
        user: {$ref: "#/components/schemas/UserRef"}
    FreezeStatus:
      type: object
      properties:
        freeze_until: {type: integer, nullable: true, description: "epoch ms; null when no freeze is running"}
        used_days:
          type: integer
          description: "Whole frozen days (rounded up) inside the last window_days, the running freeze included up to now (D10)"
        quota_days: {type: integer, example: 30}
        window_days: {type: integer, example: 90}
    Fix:
      type: object
      required: [lat, lng, t, acc]
      properties:
        lat: {type: number}
        lng: {type: number}
        t: {type: integer, description: epoch ms}
        acc: {type: number, description: horizontal accuracy in metres}
        mock: {type: boolean, default: false, description: Android isMock flag}
    RunUpload:
      type: object
      required: [id, started_at, ended_at, fixes]
      properties:
        id: {type: string, format: uuid, description: client generated}
        started_at: {type: integer}
        ended_at: {type: integer}
        integrity_token: {type: string, nullable: true}
        fixes:
          type: array
          maxItems: 20000
          items: {$ref: "#/components/schemas/Fix"}
    Flag:
      type: object
      properties:
        code: {type: string, example: mock_location}
        severity: {type: string, enum: [hard, soft]}
        detail: {type: string}
    RunStatus:
      type: object
      properties:
        id: {type: string}
        status: {type: string, enum: [processing, accepted, pending_review, rejected]}
        distance_m: {type: number, nullable: true}
        moving_seconds: {type: integer, nullable: true}
        loops:
          type: array
          items:
            type: object
            properties:
              cells: {type: integer}
              area_km2: {type: number}
        cells_claimed: {type: integer}
        cells_taken_from_others: {type: integer}
        flags:
          type: array
          items: {$ref: "#/components/schemas/Flag"}
    Cell:
      type: object
      properties:
        id: {type: string, description: H3 index at resolution 10}
        lat: {type: number, description: "Cell centre latitude (server computes it with the engine so the app needs no H3 library)"}
        lng: {type: number, description: "Cell centre longitude"}
        boundary:
          type: array
          description: "The 6 corners of the hexagon as [lat, lng] pairs, in ring order, not closed (5 for one of the 12 pentagon cells). From the engine (D10)."
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: {type: number}
        owner: {allOf: [{$ref: "#/components/schemas/UserRef"}], nullable: true}
        mine: {type: boolean}
        hidden: {type: boolean, description: "true when privacy rules hide the owner's name; owner is then null"}
        strength:
          type: number
          minimum: 0
          maximum: 1
          description: >
            ONLY present when mine is true (never for other players). The caller's faded power divided by the
            power right after their last claim of the cell: 1.0 during the grace period, then falling. A freeze
            holds it at the value it had when the freeze began. The app draws cells below 0.5 as "fading". Running
            through the cell again brings it back to 1.0 (D10, D11).
    UserListItem:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        is_following: {type: boolean}
        follows_me: {type: boolean}
    Profile:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        cells_held: {type: integer, description: "What a stranger sees on GET /cells for this user (published, named); the caller's own profile shows the live number"}
        weekly_rank: {type: integer, nullable: true, description: "Place on the weekly leaderboard, also beyond the top 100; null when no visible cells"}
        followers_count: {type: integer}
        following_count: {type: integer}
        joined_at: {type: integer, description: epoch ms}
        is_me: {type: boolean}
        is_following: {type: boolean}
        follows_me: {type: boolean}
    FollowState:
      type: object
      properties:
        is_following: {type: boolean}
        followers_count: {type: integer}
    KudosState:
      type: object
      properties:
        kudos_by_me: {type: boolean}
        kudos_count: {type: integer}
    TakenFrom:
      type: object
      properties:
        user: {$ref: "#/components/schemas/UserRef"}
        cells: {type: integer}
    RunCard:
      type: object
      description: Never carries GPS points, loops' geometry or start/end points.
      properties:
        id: {type: string, format: uuid}
        user: {$ref: "#/components/schemas/UserRef"}
        started_at: {type: integer}
        distance_m: {type: number, nullable: true}
        moving_seconds: {type: integer, nullable: true}
        pace_s_per_km: {type: number, nullable: true, description: "moving_seconds / (distance_m/1000); null under 100 m"}
        cells_claimed: {type: integer}
        cells_taken: {type: integer, description: "Of the claimed cells, how many were somebody else's"}
        taken_from:
          type: array
          description: Opponents with a visible name, with the number of cells taken from each
          items: {$ref: "#/components/schemas/TakenFrom"}
        taken_from_hidden: {type: integer, description: Cells taken from opponents whose name is hidden}
        loop_count: {type: integer}
        kudos_count: {type: integer}
        kudos_by_me: {type: boolean}
        comment_count: {type: integer}
        status: {type: string, enum: [processing, accepted, pending_review, rejected], description: "Always present in GET /runs; in the feed always accepted"}
    Comment:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        user: {$ref: "#/components/schemas/UserRef"}
        text: {type: string}
        created_at: {type: integer}
        hidden: {type: boolean, description: "true only for the author, whose comment moderation hid (others never receive it)"}
        can_delete: {type: boolean}
    BattleCounts:
      type: object
      properties:
        taken: {type: integer}
        lost: {type: integer}
    BattleSummary:
      type: object
      properties:
        days: {type: integer, example: 7}
        taken: {type: integer}
        lost: {type: integer}
        net: {type: integer}
        battles: {type: integer, description: "Distinct runs of other people that took cells from the caller, plus the caller's runs that took cells"}
    Rival:
      type: object
      properties:
        user: {$ref: "#/components/schemas/UserRef"}
        taken: {type: integer, description: Cells the caller took from them}
        lost: {type: integer, description: Cells they took from the caller}
        net: {type: integer}
        last_battle_at: {type: integer}
        is_following: {type: boolean}
    LostCell:
      type: object
      properties:
        cell: {type: string, description: H3 index}
        lat: {type: number}
        lng: {type: number}
        boundary: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}, description: "D10 shape"}
        lost_at: {type: integer, description: "epoch ms of the claim; the app shows it only after the publish delay"}
        lost_to: {allOf: [{$ref: "#/components/schemas/UserRef"}], nullable: true}
    Notification:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [cells_taken, new_follower, kudos, comment]}
        created_at: {type: integer, description: "visible_at: when the notification became visible to the caller"}
        read: {type: boolean}
        actor: {allOf: [{$ref: "#/components/schemas/UserRef"}], nullable: true, description: "null for cells_taken when every involved name is hidden"}
        cells: {type: integer, nullable: true, description: "cells_taken: cells taken, attributed to actor"}
        cells_unattributed: {type: integer, nullable: true, description: "cells_taken: further cells whose taker is hidden"}
        run_id: {type: string, nullable: true, description: "kudos and comment: the caller's own run"}
        comment_id: {type: string, nullable: true}
        comment_preview: {type: string, nullable: true, description: "comment: first 80 characters"}
  parameters:
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}, description: "Opaque; pass the previous next_cursor"}
