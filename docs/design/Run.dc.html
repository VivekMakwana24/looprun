<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Looprun live run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.lr{--bg:#0A0C0B;--surface:#121513;--raised:#181C19;--line:#262C28;--text:#F2F5EE;--text2:#C9CFC8;--muted:#A9B1A9;--accent:#C8F560;--accent-text:#C8F560;--on-accent:#0A0C0B;--rival:#FF7A45;--map:#0D100E;--park:#111A13;--road:#181D1A;--lane:#222824;--hid-fill:#262C28;--hid-line:#69726A;--paper:#F2F5EE;--on-paper:#0A0C0B;--dot:#FFFFFF;--dot-ring:#0A0C0B;--danger:#FF8A7A}
.lr[data-theme="tartan"]{--bg:#170B09;--surface:#22110D;--raised:#2C1711;--line:#40231B;--text:#FBEFE9;--text2:#E3CFC6;--muted:#C2A69B;--accent:#FF5B3A;--accent-text:#FF7A5C;--on-accent:#170B09;--rival:#8FD0FF;--map:#1C0E0B;--park:#24140F;--road:#2B1812;--lane:#3A2019;--hid-fill:#33201A;--hid-line:#8C6F64;--paper:#FBEFE9;--on-paper:#170B09;--dot:#FFFFFF;--dot-ring:#170B09;--danger:#FFB4A6}
.lr[data-theme="dawn"]{--bg:#F3EFE7;--surface:#FFFFFF;--raised:#F8F5EF;--line:#DDD6C9;--text:#15181A;--text2:#3A4044;--muted:#5C6368;--accent:#FF5A1F;--accent-text:#B93A08;--on-accent:#15181A;--rival:#2F6BE6;--map:#E9E4D8;--park:#DCE5CF;--road:#FFFFFF;--lane:#DDD6C9;--hid-fill:#D9D3C7;--hid-line:#7A746A;--paper:#15181A;--on-paper:#F3EFE7;--dot:#15181A;--dot-ring:#FFFFFF;--danger:#B3261E}
.lr[data-theme="trail"]{--bg:#0C1411;--surface:#121D18;--raised:#18251F;--line:#26372F;--text:#EEF3EC;--text2:#C7D2C8;--muted:#9FB0A4;--accent:#F6B93B;--accent-text:#F6B93B;--on-accent:#0C1411;--rival:#7FD8E8;--map:#0F1814;--park:#14241B;--road:#1A2A22;--lane:#22332B;--hid-fill:#22302A;--hid-line:#6C8074;--paper:#EEF3EC;--on-paper:#0C1411;--dot:#FFFFFF;--dot-ring:#0C1411;--danger:#FF9A8A}
.lr a{color:var(--accent-text)}
</style>
</helmet>
<div class="lr" data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 22px; background: var(--bg); color: var(--text); font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">

<div style="display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<sc-if value="{{isRecording}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.16em; color: var(--accent-text)">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block"></span>RECORDING
</div>
</sc-if>
<sc-if value="{{isPaused}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.16em; color: var(--text2)">
<span aria-hidden="true" style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--text2); display: inline-block"></span>PAUSED
</div>
</sc-if>
<sc-if value="{{isSaving}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.16em; color: var(--text2)">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: var(--text2); display: inline-block"></span>SAVING RUN
</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--muted)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-4M12 20V10M19 20V4"></path></svg>
GPS ±6 m
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 0">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.16em; color: var(--muted)">TIME</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 124px; line-height: 0.9; letter-spacing: -0.01em">21:07</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--line); padding-top: 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.16em; color: var(--muted)">DISTANCE</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 52px; line-height: 0.95">3.42</span><span style="font-size: 16px; font-weight: 500; color: var(--text2)">km</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); padding-left: 16px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.16em; color: var(--muted)">PACE</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 52px; line-height: 0.95">6:10</span><span style="font-size: 16px; font-weight: 500; color: var(--text2)">/km</span></div>
</div>
</div>

<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.16em; color: var(--muted)">YOUR LOOP SO FAR</div>
<div style="font-size: 13px; color: var(--muted)">Start is the ringed dot</div>
</div>
<svg role="img" aria-label="Your route so far, 140 metres short of closing the loop" width="320" height="214" viewBox="0 0 320 214" style="display: block">
<defs>
<pattern id="lr-dots-run" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" style="fill: var(--line)"></circle></pattern>
</defs>
<rect width="320" height="214" fill="url(#lr-dots-run)"></rect>
<path d="M58 168 C44 128 52 88 80 62 S150 28 190 32 S274 62 286 106 S270 180 224 198 S148 208 120 194" fill="none" stroke-width="5" stroke-linecap="round" style="stroke: var(--accent)"></path>
<path d="M120 194 L58 168" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8" style="stroke: var(--text)"></path>
<circle cx="58" cy="168" r="8" stroke-width="3" style="fill: var(--surface); stroke: var(--text)"></circle>
<g stroke-width="2" style="fill: var(--surface); stroke: var(--accent)">
<circle cx="80" cy="62" r="10"></circle>
<circle cx="190" cy="32" r="10"></circle>
<circle cx="286" cy="106" r="10"></circle>
</g>
<g text-anchor="middle" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; fill: var(--text)">
<text x="80" y="66">1</text>
<text x="190" y="36">2</text>
<text x="286" y="110">3</text>
</g>
<circle cx="120" cy="194" r="15" opacity="0.3" style="fill: var(--accent)"></circle>
<circle cx="120" cy="194" r="8" style="fill: var(--accent)"></circle>
</svg>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 46px; line-height: 0.9; color: var(--accent-text)">140 m</span>
<span style="font-size: 15px; font-weight: 500">to close the loop</span>
</div>
</div>
<div style="font-size: 13px; color: var(--muted)">It closes when you cross your path or come within 80 m of it.</div>
</div>

</div>

<div style="display: flex; flex-direction: column; gap: 12px">

<sc-if value="{{isRecording}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 12px">
<button type="button" aria-label="Pause run" onClick="{{pause}}" style="width: 68px; height: 68px; flex: none; border-radius: 24px; border: 1px solid var(--line); background: var(--raised); color: var(--text); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8 5v14M16 5v14"></path></svg>
</button>
<a href="Result.dc.html" style="flex: 1 1 0; height: 68px; border-radius: 24px; background: var(--paper); color: var(--on-paper); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 28px; letter-spacing: 0.03em">
<span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: var(--on-paper); display: inline-block"></span>FINISH RUN
</a>
</div>
</sc-if>

<sc-if value="{{isPaused}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px">
<button type="button" onClick="{{resume}}" style="flex: 1 1 0; height: 68px; border-radius: 24px; border: 0; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 28px; letter-spacing: 0.03em; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"></path></svg>RESUME
</button>
<a href="Result.dc.html" style="flex: 1 1 0; height: 68px; border-radius: 24px; background: var(--paper); color: var(--on-paper); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 28px; letter-spacing: 0.03em">
<span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: var(--on-paper); display: inline-block"></span>FINISH
</a>
</div>
</sc-if>

<sc-if value="{{isSaving}}" hint-placeholder-val="{{false}}">
<button type="button" disabled style="width: 100%; height: 68px; border-radius: 24px; border: 1px solid var(--line); background: var(--raised); color: var(--text2); font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 700; font-size: 28px; letter-spacing: 0.03em">SAVING…</button>
</sc-if>

<div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted)">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Lock your screen. Looprun keeps recording.
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","tartan","dawn","trail"],"default":"night","section":"Theme"},"phase":{"editor":"enum","options":["recording","paused","saving"],"default":"recording","section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const phase = s.phase ?? this.props.phase ?? 'recording';
return {
theme: this.props.theme ?? 'night',
isRecording: phase === 'recording',
isPaused: phase === 'paused',
isSaving: phase === 'saving',
pause: () => this.setState({ phase: 'paused' }),
resume: () => this.setState({ phase: 'recording' })
};
}
}
</script>
</body>
</html>
