name: Deploy

# Deploys to the Lightsail host over SSH. Builds happen ON the host; nothing is pushed to a registry.
# Runs on a v* tag or manually. Refuses unless the commit is on main AND its CI run succeeded.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Gate (on main + CI green)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not contained in origin/main. Refusing to deploy."
            exit 1
          fi
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                --status success --json databaseId --jq 'length')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful CI run found for $GITHUB_SHA. Refusing to deploy."
            exit 1
          fi
          echo "CI passed for $GITHUB_SHA"

  deploy:
    name: Deploy to Lightsail
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_HOST_KEY: ${{ secrets.LIGHTSAIL_HOST_KEY }}
      LOOPRUN_HEALTH_URL: ${{ secrets.LOOPRUN_HEALTH_URL }}
    steps:
      - name: Check secrets are present
        run: |
          for v in LIGHTSAIL_HOST LIGHTSAIL_USER LIGHTSAIL_SSH_KEY LIGHTSAIL_HOST_KEY LOOPRUN_HEALTH_URL; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$LIGHTSAIL_HOST" "$LIGHTSAIL_HOST_KEY" > ~/.ssh/known_hosts
      - name: Update checkout and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          cd /opt/looprun
          git fetch --tags origin
          git checkout --detach "$1"
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          docker image prune -f
          REMOTE
      - name: Health check
        run: |
          if curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$LOOPRUN_HEALTH_URL"; then
            echo
            echo "Healthy: $LOOPRUN_HEALTH_URL"
          else
            echo "::error::Health check failed at $LOOPRUN_HEALTH_URL. See docs/RUNBOOK.md (rollback)."
            exit 1
          fi
