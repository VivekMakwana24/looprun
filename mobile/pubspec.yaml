name: looprun
description: Looprun - a loop-closing running game on a shared H3 cell map.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1          # stay on 2.x: 3.x removed AsyncValue.valueOrNull
  go_router: ^17.0.0                # 18.x needs material_ui/cupertino_ui; 17.x is plain Flutter
  dio: ^5.9.0
  drift: ^2.35.0                    # sqlite3 3.x with build hooks; no sqlite3_flutter_libs
  path_provider: ^2.1.5
  path: ^1.9.0
  geolocator: ^14.0.2
  flutter_foreground_task: ^11.0.3  # needs the onDestroy(DateTime, bool) signature
  google_sign_in: ^6.3.0            # stay below 7 (API rewritten)
  maplibre_gl: ">=0.27.1 <0.29.0"   # 0.x caret is minor-exclusive; needs JDK 21
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.6.0

flutter:
  uses-material-design: true
