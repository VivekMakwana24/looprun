# Local development stack. Dev auth is ON: never expose this to the internet.
#   docker compose up --build
# API: http://localhost:8000  (health: /healthz, contract: docs/CONTRACT.openapi.yaml)
name: looprun-dev

x-server-env: &server-env
  LOOPRUN_DEV_AUTH: "1"
  LOOPRUN_MONGO_URL: mongodb://mongo:27017/looprun
  LOOPRUN_REDIS_URL: redis://redis:6379/0

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: *server-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *server-env
    healthcheck:
      disable: true
    depends_on:
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
