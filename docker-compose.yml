# Local development stack. Dev auth is ON: never expose this to the internet.
#   docker compose up --build
# API: http://localhost:8000  (health: /healthz, contract: docs/CONTRACT.openapi.yaml)
#
# Host ports can be moved when 6379 / 27017 / 8000 are already taken on your machine:
#   LOOPRUN_REDIS_PORT=6380 LOOPRUN_MONGO_PORT=27018 LOOPRUN_API_PORT=8001 docker compose up --build
# (or put those three lines in a .env file next to this one). Only the host side changes; the containers
# still talk to each other on the default ports.
name: looprun-dev

x-server-env: &server-env
  LOOPRUN_DEV_AUTH: "1"
  # Google OAuth client ID of type "Web application". Not a secret. The app sends the same ID as
  # GOOGLE_SERVER_CLIENT_ID, and the server checks that Google ID tokens were issued for it.
  LOOPRUN_GOOGLE_CLIENT_ID: 623419287179-qsuu1f445he87kb6bomk1lp40fnmadk9.apps.googleusercontent.com
  LOOPRUN_MONGO_URL: mongodb://mongo:27017/looprun
  LOOPRUN_REDIS_URL: redis://redis:6379/0

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment: *server-env
    ports:
      - "127.0.0.1:${LOOPRUN_API_PORT:-8000}:8000"
    depends_on:
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["celery", "-A", "app.worker:celery_app", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "--loglevel=info", "--concurrency=2"]
    environment: *server-env
    # Exactly one worker container runs the embedded beat (-B); /tmp is writable for uid 10001
    # (the working directory /app is root-owned). Do not scale this service above 1.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME -t 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis: {condition: service_healthy}
      mongo: {condition: service_healthy}

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${LOOPRUN_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:${LOOPRUN_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
